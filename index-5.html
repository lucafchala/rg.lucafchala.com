<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RG · Guias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #0f1117;
      --surface: #181c27;
      --border:  #252a38;
      --accent:  #4f8ef7;
      --accent2: #7c5cfc;
      --ok:      #3ecf6e;
      --text:    #e4e8f0;
      --muted:   #8893a8;
      --danger:  #f75f5f;
      --mono:    'JetBrains Mono', monospace;
      --sans:    'Inter', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── PIN GATE ── */
    #gate {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .lock-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, rgba(79,142,247,.15), rgba(124,92,252,.15));
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    #gate h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.02em;
      color: #fff;
      margin-bottom: 6px;
    }

    #gate p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .pin-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    #pin-input {
      flex: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: 20px;
      letter-spacing: .3em;
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color .15s;
      -webkit-text-security: disc;
      text-security: disc;
      min-width: 0; /* prevent overflow */
    }

    #pin-input:focus { border-color: var(--accent); }
    #pin-input.error { border-color: var(--danger); animation: shake .3s; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-5px); }
      75%      { transform: translateX(5px); }
    }

    #pin-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: opacity .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      /* bigger tap target */
      min-width: 52px;
    }
    #pin-btn:active { opacity: .75; }

    #pin-error {
      font-size: 13px;
      color: var(--danger);
      min-height: 20px;
      margin-top: 6px;
    }

    /* ── MAIN MENU ── */
    #menu {
      display: none;
      width: 100%;
      max-width: 480px;
    }

    .menu-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .menu-header .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .menu-header h1 {
      font-size: clamp(24px, 6vw, 30px);
      font-weight: 700;
      letter-spacing: -.025em;
      color: #fff;
      margin-bottom: 8px;
    }

    .menu-header p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Cards stacked vertically on mobile, side-by-side on wider screens */
    .nav-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 440px) {
      .nav-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
    }

    .nav-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      text-decoration: none;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      gap: 16px;
      transition: border-color .15s, background .15s;
      /* Bigger tap target feel */
      min-height: 80px;
    }

    @media (min-width: 440px) {
      .nav-card {
        flex-direction: column;
        align-items: flex-start;
        padding: 22px 20px;
        min-height: unset;
      }
    }

    .nav-card:active {
      border-color: var(--accent);
      background: rgba(79,142,247,.06);
    }

    @media (hover: hover) {
      .nav-card:hover {
        border-color: var(--accent);
        background: rgba(79,142,247,.06);
        transform: translateY(-2px);
      }
    }

    .nav-card .card-icon {
      font-size: 30px;
      line-height: 1;
      flex-shrink: 0;
    }

    @media (min-width: 440px) {
      .nav-card .card-icon { margin-bottom: 14px; font-size: 28px; }
    }

    .nav-card .card-text { flex: 1; min-width: 0; }

    .nav-card .card-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3px;
    }

    .nav-card .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      letter-spacing: -.01em;
    }

    .nav-card .card-desc {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .nav-card .card-arrow {
      font-size: 18px;
      color: var(--border);
      flex-shrink: 0;
      transition: color .15s;
    }

    @media (min-width: 440px) {
      .nav-card .card-text { flex: unset; }
      .nav-card .card-arrow { margin-top: 16px; }
    }

    .nav-card:active .card-arrow,
    .nav-card:hover .card-arrow { color: var(--accent); }

    .logout-btn {
      margin-top: 24px;
      text-align: center;
    }

    .logout-btn button {
      background: none;
      border: none;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      font-family: var(--sans);
      transition: color .15s;
      padding: 8px 16px; /* tap target */
    }
    .logout-btn button:active { color: var(--danger); }
  </style>
</head>
<body>

  <!-- PIN GATE -->
  <div id="gate">
    <div class="lock-icon">🔒</div>
    <h1>Acesso restrito</h1>
    <p>Digite o PIN para acessar os guias.</p>
    <div class="pin-row">
      <input
        id="pin-input"
        type="password"
        inputmode="numeric"
        maxlength="8"
        placeholder="••••"
        autocomplete="off"
        autofocus
      />
      <button id="pin-btn" onclick="checkPin()" title="Entrar">→</button>
    </div>
    <div id="pin-error"></div>
  </div>

  <!-- MENU PRINCIPAL -->
  <div id="menu">
    <div class="menu-header">
      <div class="eyebrow">rg.lucafchala.com</div>
      <h1>Guias de RG</h1>
      <p>Digitalização e impressão do documento de identidade.</p>
    </div>

    <div class="nav-grid">
      <a class="nav-card" href="scan.html">
        <div class="card-icon">🖨️</div>
        <div class="card-text">
          <div class="card-label">Guia 01</div>
          <div class="card-title">Escanear</div>
          <div class="card-desc">Como digitalizar o RG em PDF no tamanho correto.</div>
        </div>
        <div class="card-arrow">→</div>
      </a>
      <a class="nav-card" href="print.html">
        <div class="card-icon">📄</div>
        <div class="card-text">
          <div class="card-label">Guia 02</div>
          <div class="card-title">Imprimir</div>
          <div class="card-desc">Como imprimir sem bordas e no tamanho real.</div>
        </div>
        <div class="card-arrow">→</div>
      </a>
    </div>

    <div class="logout-btn">
      <button onclick="logout()">Sair da sessão</button>
    </div>
  </div>

  <script>
    const SESSION_KEY = 'rg_auth';

    function getExpectedPin() {
      const meta = document.querySelector('meta[name="x-pin-hash"]');
      return meta ? meta.content : null;
    }

    async function hashPin(pin) {
      const enc = new TextEncoder().encode('rg::' + pin);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    async function checkPin() {
      const input = document.getElementById('pin-input');
      const errorEl = document.getElementById('pin-error');
      const pin = input.value.trim();
      if (!pin) return;

      const expected = getExpectedPin();
      if (!expected) { unlock(); return; }

      const hashed = await hashPin(pin);
      if (hashed === expected) {
        sessionStorage.setItem(SESSION_KEY, '1');
        unlock();
      } else {
        errorEl.textContent = 'PIN incorreto.';
        input.classList.add('error');
        input.value = '';
        setTimeout(() => {
          input.classList.remove('error');
          errorEl.textContent = '';
        }, 1200);
        input.focus();
      }
    }

    function unlock() {
      document.getElementById('gate').style.display = 'none';
      document.getElementById('menu').style.display = 'block';
    }

    function logout() {
      sessionStorage.removeItem(SESSION_KEY);
      location.reload();
    }

    document.getElementById('pin-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkPin();
    });

    if (sessionStorage.getItem(SESSION_KEY) === '1') unlock();
  </script>
</body>
</html>
